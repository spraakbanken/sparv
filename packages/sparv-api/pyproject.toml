[project]
name = "sparv-api"
version = "5.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
authors = [{ name = "Språkbanken", email = "sb-info@svenska.gu.se" }]
dependencies = [
  "PyYAML~=6.0",
  "appdirs~=1.4",
  "jsonschema-rs==0.61.2",
  # "markdown>=3.9",
  # "packaging>=21.0",
  "pycountry~=26.2",
  # "python-dateutil==2.9.0",
  "python-json-logger~=4.0",
  "questionary==1.10.0",
  "requests>=2.32.3",
  "rich~=15.0",
  "snakemake==9.27.2",
  "typing-inspect==0.9.0"
]

[build-system]
requires = ["uv_build>=0.12.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
  "sparv.api",
  "sparv.core",
  "sparv.core_modules.export",
  "sparv.core_modules.import",
  "sparv.core_modules.metadata",
  "sparv.core_modules.sparv",
]
